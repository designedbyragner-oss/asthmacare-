name: asthma_care
description: "AsthmaCare — نظام ذكي للكشف المبكر عن التغيرات المرتبطة بتفاقم الربو"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # إدارة الحالة والتنقل
  hooks_riverpod: ^2.6.1
  go_router: ^14.6.0

  # BLE (جهاز البيئة + السوار)
  flutter_blue_plus: ^1.32.0

  # التخزين المحلي المشفر
  drift: ^2.32.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # الرسوم البيانية والتصدير
  fl_chart: ^0.69.0
  csv: ^6.0.0
  pdf: ^3.11.1
  arabic_reshaper: ^0.0.1
  bidi: ^2.0.10

  # التنبيهات المحلية
  flutter_local_notifications: ^17.2.3

  # أذونات Android 12+ (BLE / الإشعارات)
  permission_handler: ^11.3.1

  # أدوات
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  # محاكاة SharedPreferencesAsync في الاختبارات (تُستهلك مباشرة من test/)
  shared_preferences_platform_interface: ^2.4.2

# تشفير قاعدة البيانات عبر SQLite3MultipleCiphers (D4) — النمط الحالي المعتمد في drift
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  assets:
    - assets/images/devices/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 600
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
